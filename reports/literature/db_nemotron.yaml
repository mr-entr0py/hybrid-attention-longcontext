  access_level: "[code-inspected]"
  research_question: "What layer patterns were actually released, and do they match the papers?"
  mechanism: "hybrid_override_pattern strings (M = Mamba-2, * = attention, - = MLP, E = MoE); Nemotron-Flash layer_types (deltanet / m2 / a / f); Bolt-74B layers_block_type."
  manipulated_vars: "n/a"
  controlled_vars: "n/a"
  model_sizes_and_training: "8B: 52L, 4* at 7, 18, 29, 40. 56B: 118L, 10* every 11 layers from 7. 47B: 98L, 5* at 17, 38, 49, 60, 86 (45 M / 48 -). 4B: 52L, same pattern as 8B, d 3072. Nano-12B-v2: 62L, 6* at 7, 16, 25, 34, 43, 52, Mamba head dim 80. Nano-9B-v2: 56L, 4* at 14, 21, 30, 39. Nemotron-3-Nano-30B-A3B: 52L, 6* (2 KV heads). Flash-1B: 2 full-attention of 12 mixers (positions 4, 12); Flash-3B: 3 of 18 (4, 12, 20). Bolt-74B-A9B: 88L, 8* / 40 M / 40 E. Bolt-E4B: Gemma4, 7 full + 35 sliding attention (not Mamba)."
  benchmarks: "n/a"
