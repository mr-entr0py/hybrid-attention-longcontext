- id: nemotron_h_2025
  title: "Nemotron-H: A Family of Accurate and Efficient Hybrid Mamba-Transformer Models"
  authors: "NVIDIA (core architecture: B. Norick, D. Riach, R. Waleffe, W. Byeon; et al.)"
  year: 2025
  venue_or_status: "arXiv 2504.03624 (v4, 5 Sep 2025), technical report"
  url: "https://arxiv.org/abs/2504.03624"
  code_url: "https://huggingface.co/nvidia/Nemotron-H-8B-Base-8K ; https://github.com/NVIDIA/Megatron-LM"
  access_level: "[read-full]"
  research_question: "Can hybrid Mamba-2/attention/FFN models match similarly sized Transformers while being faster at inference (especially long generations)?"
  mechanism: "Replace most self-attention layers with Mamba-2 (constant per-token state). ~8% of layers are GQA attention (8 KV heads), evenly dispersed, each followed by an FFN; the remaining layers are alternating Mamba-2 and squared-ReLU FFN; first layer Mamba-2, last layer FFN; no position embeddings."
  manipulated_vars: "None for the attention ratio (8% is inherited from Waleffe et al. 2024). Compared hybrid vs Transformer (Nemotron-T-8B) on same data; FP8 vs BF16; MiniPuzzle pruning 56B->47B."
  controlled_vars: "Nemotron-H-8B vs Nemotron-T-8B: same data, d_model 4096, FFN dim 21504, 32 Q / 8 KV heads, squared ReLU. NOT controlled: depth (52 vs 32 layers), position encoding (none vs RoPE), number and split of mixer/FFN layers."
  model_sizes_and_training: "8B (52 layers: 4 attention / 24 Mamba-2 / 24 FFN; pattern M-M-M-M*-M-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M-; attention at 7, 18, 29, 40) on 15T tokens; 56B (118 layers: 10/54/54) on 20T tokens in FP8; seq 8192, batch 768 (6.29M tokens), peak LR 8e-4 (8B) / 4e-4 (56B), cosine to 1%, wd 0.1, betas (0.9, 0.95); 47B via MiniPuzzle (5 attention layers kept of 10; 63B distillation tokens). Long context (up to 512K) only in post-training SFT."
  benchmarks: "MMLU, MMLU-Pro, GSM8K, MATH, HumanEval(+), MBPP(+), ARC-C, HellaSwag, Winogrande, PIQA, OBQA; VLM suite; reasoning suite (AIME25, GPQA, LCB, BFCL, IFEval, Arena-Hard); RULER 128K (post-trained, ~83%)."
  main_findings: "8B hybrid is higher than the same-data Transformer on 7/15 tasks and within 1 point on 4 more; 56B beats Llama-3.1-70B on 16/17 tasks; up to 3x throughput at 65K input / 1K output on H100 (Megatron inference for Nemotron-H vs vLLM 0.7.3 for baselines); layer-importance MSE shows some attention layers among the least important (e.g. layer 84 in the 56B) and others locally important (40, 51, 62, 73); pruning to 5/10 attention is near-lossless on SHORT-context benchmarks; Mamba head pruning hurts badly."
  limitations: "No attention-ratio or placement ablation; base models are 8K and not evaluated on long context; throughput measured with different inference stacks; no KV vs state memory breakdown; hybrid-vs-Transformer comparison confounded by depth and position encoding. Config/text mismatch: 47B config has 45 M / 48 MLP vs text 44 / 49."
  relevance_to_us: "high: the canonical 'few attention layers' design and source of the ~8% folklore, but must NOT be presented as a controlled ratio study. Useful for block structure (mixer + MLP), NoPE choice, and the released patterns."
  reproducible_or_adaptable: "Adaptable: block layout (M-/*- pairs), NoPE, GQA, AdamW recipe. Not reproducible at our scale (15-20T tokens, FP8, 6144 H100s)."

- id: waleffe_2024_empirical_mamba
  title: "An Empirical Study of Mamba-based Language Models"
  authors: "R. Waleffe, W. Byeon, D. Riach, B. Norick, V. Korthikanti, T. Dao, A. Gu, A. Hatamizadeh, S. Singh, D. Narayanan, G. Kulshreshtha, V. Singh, J. Casper, J. Kautz, M. Shoeybi, B. Catanzaro"
  year: 2024
  venue_or_status: "arXiv 2406.07887 (v1, 12 Jun 2024), technical report"
  url: "https://arxiv.org/abs/2406.07887"
  code_url: "https://github.com/NVIDIA/Megatron-LM/tree/ssm/examples/mamba ; checkpoints https://huggingface.co/nvidia/mamba2-hybrid-8b-3t-4k , https://huggingface.co/nvidia/mamba2-hybrid-8b-3t-128k , https://huggingface.co/nvidia/mamba2-8b-3t-4k"
  access_level: "[read-full]"
  research_question: "At 8B / up to 3.5T tokens, do Mamba / Mamba-2 match Transformers on the same data, and can a hybrid with a few attention layers fix SSM weaknesses (copying, in-context learning, long context)?"
  mechanism: "Mamba-2 + GQA attention + MLP layers, parameter-matched per layer type; attention and MLPs evenly distributed by Algorithm 1 (Appendix A); no position embeddings; first layer Mamba."
  manipulated_vars: "Architecture (Transformer / Mamba / Mamba-2 / Mamba-2-Hybrid); token horizon (1.1T vs 3.5T); in ablations: attention-layer fraction (0, 1, 2, 3, 4, 5, 7, 12, 24 of 24 layers at 130M), MLP fraction (5-50% at 8% attention), RoPE vs none (840M), layer ordering (no numbers shown), GQA vs MHA; context extension 4K -> 16K / 32K / 128K."
  controlled_vars: "Same data, tokenizer (256K SentencePiece), hyperparameters (batch, LR, warmup 122K samples, cosine, wd 0.1, BF16, seq 4096), ~8B params; in the ratio sweep, per-layer parameter count equalised by adjusting attention heads and MLP expansion. NOT controlled: MLP content between pure-SSM (no MLP) and hybrid (50% MLP); position encoding (RoPE Transformer vs NoPE hybrid) in long-context comparisons."
  model_sizes_and_training: "8B models: Transformer 32 layers (RoPE, SwiGLU); Mamba / Mamba-2 56 layers (state 128, 8 groups, head dim 64, expand 2); hybrid 56 layers = 24 Mamba-2 + 4 attention + 28 MLP (pattern M+M+M++M+M*+M+M+M+M++M*+M+M+M+M+M*++M+M+M+M+M*+M++M+M+M+). Ablations at 130M (24 layers) and 840M. LC extension: +50B tokens, LR 3e-5 -> 3e-6, packed same data, full global attention; Transformer uses dynamic NTK RoPE."
  benchmarks: "12 lm-eval-harness tasks (WG, PIQA, HellaSwag, ARC-E/C, MMLU incl. cloze variants, OBQA, TruthfulQA, PubMedQA, RACE, NQ, SquadV2); Phonebook (standard / reversed); long context: NarrativeQA, Qasper, QuALITY, LongBench (MultiFieldQA, HotpotQA, 2WikiMQA, Musique, TREC, TriviaQA); RULER 13 tasks (8 NIAH, VT, CWE, KWE, SquadQA, HotpotQA) at 4K / 16K / 32K, 400 samples each."
  main_findings: "Validation loss vs attention fraction (130M, 24 layers) is U-shaped with minimum ~8% (2/24); digitized: 0%:2.615, 4.2%:2.562, 8.3%:2.554, 12.5%:2.555, 16.7%:2.555, 20.8%:2.560, 29.2%:2.568, 50%:2.593, 100%:2.631 (INF: 1 layer captures ~87% of the gain). 30-50% MLP costs no loss. NoPE >= RoPE after 16K extension (53.43 vs 52.61). Even spacing was as good as any ordering tried (loss). Pure SSMs fail Phonebook beyond ~0.5-1K tokens. 8B hybrid beats the Transformer on all 12 short tasks (+2.65 avg) and on RULER (4K 81.99 vs 77.62; 16K 74.19 vs 62.33; 32K 69.93 vs 56.49; VT 83.2 vs 7.25 at 16K) but loses on KWE and LongBench multi-doc QA (16K HotpotQA 42.17 vs 48.61; natural-task avg 44.60 vs 45.24). Hybrid Phonebook extrapolates beyond trained length; Transformer degrades near it. ~8x decode speedup is PREDICTED (Fig. 5), not measured."
  limitations: "Ratio and placement ablations use validation loss only (no retrieval or long-context metric); MLP ratio, tokens, seq length and PE in the ratio sweep unstated; 840M confirmation not shown; single seeds; PE confound in long-context comparisons; packed-document CPT may bias hybrids; hybrids more prompt-sensitive."
  relevance_to_us: "high: the only controlled attention-ratio sweep in the NVIDIA line and the origin of '8%'; gives the allocation algorithm, parameter-matching method, Phonebook and RULER protocol; but its optimum is a loss optimum, not a long-context one."
  reproducible_or_adaptable: "Adaptable and partly reproducible: Algorithm 1 verified against Megatron code; the 130M / 24-layer sweep design is near our scale and could be re-run with retrieval metrics and an explicit MLP setting."

- id: nemotron_nano2_2025
  title: "NVIDIA Nemotron Nano 2: An Accurate and Efficient Hybrid Mamba-Transformer Reasoning Model"
  authors: "NVIDIA"
  year: 2025
  venue_or_status: "arXiv 2508.14444 (v4, 2 Sep 2025), technical report"
  url: "https://arxiv.org/abs/2508.14444"
  code_url: "https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-9B-v2 ; https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-12B-v2-Base"
  access_level: "[read-section]"
  research_question: "Build a 9B hybrid reasoning model with high throughput for long thinking traces that fits 128K context on an A10G."
  mechanism: "Nemotron-H layout (~8% attention, evenly dispersed, NoPE); 12B base pruned (Minitron) to 9B with depth + width pruning while keeping 4 attention layers."
  manipulated_vars: "Long-context CPT length (128K / 256K / 512K) and synthetic doc-QA (ablated on Nemotron-H 8B); pruning depth (52 / 54 / 56 layers); width candidates; reasoning-data share in distillation."
  controlled_vars: "Attention layers fixed at 4 during depth-pruning comparison."
  model_sizes_and_training: "12B base: 62 layers = 6 attention / 28 Mamba-2 / 28 FFN (attention at 7, 16, 25, 34, 43, 52), d 5120, FFN 20480, 40 Q / 8 KV heads; config Mamba head dim 80 (paper text says 64). 20T tokens FP8, seq 8192, batch 768, WSD stable LR 4.5e-4 -> 4.5e-6 over last 3.6T. LC phase: 512K seq, constant LR 4.5e-6, 18.9B tokens, 20% synthetic long-doc QA. 9B: 56 layers, 4 attention (at 14, 21, 30, 39), d 4480, FFN 15680."
  benchmarks: "MMLU, MMLU-Pro, AGIEval, GSM8K, MATH, AIME24, HumanEval+, MBPP+, commonsense, Global-MMLU-Lite, MGSM, RULER-128K (13-task avg); reasoning benchmarks for the aligned model."
  main_findings: "RULER-128K on Nemotron-H 8B by CPT setting: 128K + synth 73.68; 256K no synth 70.19; 256K + synth 79.04; 512K + synth 81.04. Base RULER-128K: 12B 84.74, 9B 82.22 (6 -> 4 attention plus width pruning; confounded). Depth strongly matters (52 / 54 / 56 layers -> 44.92 / 47.35 / 51.48 after 6B-token KD). Up to 6.3x throughput vs Qwen3-8B (vLLM, A10G, 8K in / 16K out)."
  limitations: "No controlled attention-ratio study; '7-8% is reasonable' asserted from prior work; pruning results confounded with distillation; text vs config mismatch on Mamba head dim."
  relevance_to_us: "med: concrete long-context extension recipe (longer-than-target CPT plus synthetic doc QA helps RULER); shows NVIDIA keeps ~4 attention layers as a long-context floor."
  reproducible_or_adaptable: "Adaptable (CPT recipe idea, 80/20 blend); not reproducible at scale."

- id: nemotron_flash_2025
  title: "Nemotron-Flash: Towards Latency-Optimal Hybrid Small Language Models"
  authors: "Y. Fu, X. Dong, S. Diao, M. Van keirsbilck, H. Ye, W. Byeon, Y. Karnati, L. Liebenwein, H. Zhang, N. Binder, M. Khadkevich, A. Keller, J. Kautz, Y. (Celine) Lin, P. Molchanov"
  year: 2025
  venue_or_status: "arXiv 2511.18890 (v1, 24 Nov 2025); best match for the user's 'Nemotron Edge' (no paper by that exact name exists)"
  url: "https://arxiv.org/abs/2511.18890"
  code_url: "https://huggingface.co/nvidia/Nemotron-Flash-1B ; https://huggingface.co/nvidia/Nemotron-Flash-3B"
  access_level: "[read-full]"
  research_question: "What determines real-device latency of small LMs (depth-width ratio, operator choice), and can a search find latency-optimal hybrid operator combinations?"
  mechanism: "Interleaved DeltaNet-FFN-Mamba2-FFN and Attention-FFN-Mamba2-FFN blocks found by aging-evolution search with a short-training PPL proxy; weight normalization (unit-norm projection); 256 meta tokens; large-vocabulary tokenizer."
  manipulated_vars: "Depth / width (Llama 6-30 blocks); operator type (Mamba, Mamba2, GLA, DeltaNet, Gated DeltaNet, RWKV7, SWA) in pure and pairwise hybrids at 500M; searched operator ratios and FFN ratios; weight norm on / off; meta tokens on / off; number of full-attention layers (3 FA / 2 FA + 1 SWA / 1 FA + 2 SWA) in the 3B via 25B-token CPT at 29K."
  controlled_vars: "500M-parameter, 24-operator models on 100B SmolLM-corpus tokens, AdamW LR 5e-4 cosine; for the attention ablation, the same pretrained 3B base and the same CPT budget."
  model_sizes_and_training: "Flash-1B (0.96B): 24 operators, 2 full attention / 4 DeltaNet / 6 Mamba2 mixers + 12 FFN, d 2048, FFN 6144, 16 / 4 heads. Flash-3B (2.7B): 36 operators, 3 FA / 6 DeltaNet / 9 Mamba2, d 3072. 4.5T tokens, LR 1e-3, no wd (weight norm), batch 2M tokens, ctx 4096 then 29K for last 25B tokens; 256 H100s."
  benchmarks: "MMLU, commonsense (PIQA, ARC-C / E, HellaSwag, Winogrande, OBQA), GSM8K, MathQA, HumanEval(+), MBPP(+), recall (FDA, SWDE, SQuAD), RULER NIAH single 1-3 at 4K-32K; latency (H100, bs 1, 8K decode, CUDA Graph); throughput (32K input, max batch)."
  main_findings: "Deep-thin is not latency-optimal. DeltaNet / Gated DeltaNet on the 500M PPL-latency frontier (pure Wiki PPL: GDN 23.80, DeltaNet 23.87, Mamba2 24.36, Attn 24.44); pairing with Mamba2 helps more consistently than pairing with attention. Short-train vs full-train PPL Spearman 0.888. Attention ablation (3B): 3 FA vs 1 FA + 2 SWA keeps short recall (73.25 vs 73.77) but NIAH single_3 @32K falls 0.69 -> 0.32 (single_2: 0.91 -> 0.60; @24K single_3 0.93 -> 0.59) while throughput rises 2939 -> 4657 tok/s; authors recommend >=2 full-attention layers even in SLMs."
  limitations: "Search proxy is language modelling only (acknowledged); the attention ablation replaces FA with SWA (not linear attention), via CPT not from scratch, 3 configs, single runs; recall benchmarks are short-context."
  relevance_to_us: "high: closest NVIDIA small-model evidence that the number of full-attention layers matters for long-context retrieval but not for short-context metrics (H3 / H5), plus operator-choice data for picking our linear mixer and a warning about decode-benchmark stacks (5-7x spread)."
  reproducible_or_adaptable: "Adaptable: NIAH-by-length grid design, short-train screening, FLA-based DeltaNet; weight-norm trick optional (would be a confound if used for only some r)."

- id: nemotron3_nano_2025
  title: "Nemotron 3 Nano: Open, Efficient Mixture-of-Experts Hybrid Mamba-Transformer Model for Agentic Reasoning"
  authors: "NVIDIA"
  year: 2025
  venue_or_status: "arXiv 2512.20848 (v1, 23 Dec 2025), technical report"
  url: "https://arxiv.org/abs/2512.20848"
  code_url: "https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16 ; https://github.com/NVIDIA-NeMo/Nemotron"
  access_level: "[read-section]"
  research_question: "Scale the Nemotron hybrid with sparse MoE FFNs for agentic reasoning with 1M context."
  mechanism: "52 layers: 23 Mamba-2 + 23 MoE (128 experts, top-6, 2 shared) + 6 GQA attention (2 KV heads); NoPE."
  manipulated_vars: "LC CPT blend (512K-only vs 512K + 4K mix) and other recipe choices; no ratio ablation."
  controlled_vars: "n/a"
  model_sizes_and_training: "31.6B total / 3.2B active; 25T tokens, WSD peak 1e-3 -> 1e-5 over last 5T, seq 8192, batch 3072; LC phase 121B tokens, constant LR 1e-5, 512K + 4K sequence mix; attention at layers 5, 12, 19, 26, 33, 42 (11.5% of layers / 20.7% of mixers)."
  benchmarks: "MMLU(-Pro), AGIEval, HumanEval, MBPP, GSM8K, MATH, commonsense, RACE, multilingual, RULER 64K / 128K / 256K; post-trained agentic / reasoning suite."
  main_findings: "RULER 64K / 128K / 256K = 87.50 / 82.92 / 75.44 (base) vs Qwen3-30B-A3B-Base 63.55 / 60.69; 512K-only CPT slightly hurt short-context scores, fixed by mixing 4K sequences; 3.3x throughput vs Qwen3-30B-A3B-Thinking (H200)."
  limitations: "No ratio / placement ablation; MoE confounds comparison with dense hybrids."
  relevance_to_us: "low: shows the NVIDIA attention share drifting up (7.7% -> 11.5% of layers) and the short + long sequence mix trick for LC CPT."
  reproducible_or_adaptable: "Adaptable only for the CPT data-mix idea."

- id: jet_nemotron_2025
  title: "Jet-Nemotron: Efficient Language Model with Post Neural Architecture Search"
  authors: "Y. Gu, Q. Hu, S. Yang, H. Xi, J. Chen, S. Han, H. Cai (NVIDIA)"
  year: 2025
  venue_or_status: "arXiv 2508.15884 (v3, 28 Sep 2025)"
  url: "https://arxiv.org/abs/2508.15884"
  code_url: "https://github.com/NVlabs/Jet-Nemotron (local clone at third_party/Jet-Nemotron, not inspected by this agent)"
  access_level: "[read-section]"
  research_question: "Starting from a pretrained full-attention LM with frozen MLPs, where should the few full-attention layers go, which linear block is best, and what hyperparameters maximise accuracy and throughput?"
  mechanism: "PostNAS: once-for-all super network with alternative linear-attention paths trained by feature distillation; beam search for full-attention placement with task-specific objectives; JetBlock linear attention; hardware-aware KV-dim / head search."
  manipulated_vars: "Placement and number of full-attention layers; linear block type (RWKV7, RetNet, Mamba2, GLA, DeltaNet, Gated DeltaNet, JetBlock); key / value dims and heads."
  controlled_vars: "Frozen MLP weights from Qwen2.5-1.5B / 3B; KV cache size held fixed in the hyperparameter search."
  model_sizes_and_training: "Jet-Nemotron-2B (from Qwen2.5-1.5B, 28 layers): full attention at layers 15, 20; SWA (window 1152) at 21, 22; JetBlock elsewhere. 4B (from Qwen2.5-3B): FA at 18, 21, 33; 7 SWA layers (window 2048)."
  benchmarks: "MMLU(-Pro), math, commonsense, retrieval, coding, LongBench up to 64K; throughput up to 256K on H100."
  main_findings: "Only 2 (MMLU) or 2-3 (retrieval) attention layers are critical; the layers that matter differ by task; learned placement significantly beats uniform placement; 2B gets up to 53.6x decode / 6.1x prefill speedup vs Qwen3-1.7B at 256K (theoretical max 56x)."
  limitations: "Retrofit / distillation regime, not from-scratch training; placement found by task-specific search (risk of overfitting to the eval); I did not read the full experimental tables."
  relevance_to_us: "high for H3 / H4 (task-specific critical layers), but the regime differs from our from-scratch sweep."
  reproducible_or_adaptable: "Adaptable: the per-layer 'single full-attention layer' probing idea can be applied to our trained models post hoc."

- id: hymba_2024
  title: "Hymba: A Hybrid-head Architecture for Small Language Models"
  authors: "NVIDIA (X. Dong, Y. Fu, et al.)"
  year: 2024
  venue_or_status: "arXiv 2411.13676 (v1, 20 Nov 2024)"
  url: "https://arxiv.org/abs/2411.13676"
  code_url: "https://huggingface.co/nvidia/Hymba-1.5B-Base (config inspected); local clone at third_party/hymba (not inspected by this agent)"
  access_level: "[read-section]"
  research_question: "Can parallel attention + SSM heads within each layer give better small LMs, and how much global attention is needed?"
  mechanism: "Parallel hybrid heads (attention + Mamba, mean-fused); SWA in most layers; global (full) attention in first, middle and last layers; cross-layer KV sharing; meta tokens."
  manipulated_vars: "Attention:Mamba head parameter ratio (0:1 ... 1:2.12, attention-only); all-SWA vs SWA + 3 full layers; KV sharing; fusion type; meta tokens."
  controlled_vars: "300M params, 100B tokens for ablations; same recipe across variants."
  model_sizes_and_training: "Ablations 300M / 100B tokens (seq 1K in the 300M comparison, SWA 256); final 350M / 1.5B on 1.5T tokens (seq 2K, then 8K for last 100B)."
  benchmarks: "Commonsense average (8 tasks); recall-intensive average (e.g. SWDE, FDA, SQuAD); throughput at 8K / batch 128 on A100; cache MB at 8K."
  main_findings: "All-SWA drops recall avg from 49.90 to 29.78; adding full attention in 3 layers (first / middle / last) restores it to 48.79 with throughput 2399.7 vs 876.7 tok/s and cache 41.19 vs 148.24 MB; the same compression on a pure Transformer drops recall 39.98 -> 28.18; gains saturate at an attention:Mamba parameter ratio of 1:2.12."
  limitations: "Parallel-head hybrid (not layer-wise linear vs full); recall tasks are short-context; SWA rather than linear attention as the cheap path."
  relevance_to_us: "med: supplies a concrete non-uniform placement candidate (first / middle / last) and evidence that recurrent layers let full attention be sparse."
  reproducible_or_adaptable: "Adaptable: first / middle / last placement as a placement-arm condition."

- id: hf_configs_nemotron_family
  title: "Official Hugging Face config.json files for Nemotron-H / Nano v2 / Nemotron 3 Nano / Nemotron-Flash / Nemotron 3.5 Bolt / Hymba"
  authors: "NVIDIA"
  year: 2025
  venue_or_status: "Model repositories on huggingface.co (fetched 2026-11-09)"
