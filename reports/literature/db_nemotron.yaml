  limitations: "Configs do not reveal training details; the pruned-model index space differs from the parent."
  relevance_to_us: "high: ground truth for patterns; shows the ratio convention matters (layers vs mixers)."
  reproducible_or_adaptable: "Reproducible (public files; parsing script in session scratchpad)."

- id: megatron_lm_hybrid_code
  title: "Megatron-LM hybrid (Mamba / attention / MLP) model and layer-allocation code"
  authors: "NVIDIA"
  year: 2026
  venue_or_status: "GitHub repository, commit 928ce7ce256b734f00f1c81ddd3a8958d6b61ebf (2026-11-08)"
  url: "https://github.com/NVIDIA/Megatron-LM"
  code_url: "https://github.com/NVIDIA/Megatron-LM/blob/928ce7ce256b734f00f1c81ddd3a8958d6b61ebf/megatron/core/models/hybrid/hybrid_layer_allocation.py ; local: third_party/Megatron-LM (sparse)"
  access_level: "[code-inspected]"
  research_question: "How are hybrid layer patterns specified and allocated in NVIDIA's training code?"
  mechanism: "pattern_from_ratios(num_layers, attention_ratio, mlp_ratio) implements Waleffe Algorithm 1 (even spacing via a running-remainder x<0.5 rule; starts and ends with Mamba; MLPs biased so the sequence ends with MLP); ratio args now 'deprecated' in favour of --hybrid-layer-pattern; symbols include M, G (GatedDeltaNet), K (KDA), *, W (sliding window), -, E."
