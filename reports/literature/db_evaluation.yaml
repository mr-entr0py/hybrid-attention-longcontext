- id: chen2024stuffedmamba
  title: "Stuffed Mamba: Oversized States Lead to the Inability to Forget"
  authors: "Yingfa Chen, Xinrong Zhang, Shengding Hu, Xu Han, Zhiyuan Liu, Maosong Sun"
  year: 2024
  venue_or_status: "arXiv 2410.07145 (v4 Jan 2026)"
  url: "https://arxiv.org/html/2410.07145"
  code_url: ""
  access_level: "[read-section]"
  research_question: "Why do RNNs fail beyond training length; state size vs capacity"
  mechanism: "State collapse analysis; passkey; per-position LM loss"
  manipulated_vars: "training length (to 256K), model/state size"
  controlled_vars: "RedPajama-V2 (docs >=4K), NTP only"
  model_sizes_and_training: "Mamba-2 130M-1.3B official + continued pretraining; from scratch 36M, 47M, 85M"
  benchmarks: "5-digit passkey (T_recall = max length with >95% acc), per-position LM loss"
  main_findings: "Mamba-2 near-perfect passkey within 8K but poor >16K; LM loss rises past train length; forget threshold linear in state size; recall threshold exponential in state size (fits given; units unconfirmed); passkey used for LR/checkpoint selection (NTP-only training)."
  limitations: "Sample counts n not stated; state-size units unclear."
  relevance_to_us: "high — passkey measurable zero-shot at 36-85M; per-position loss necessary diagnostic"
  reproducible_or_adaptable: "Protocol adaptable"

