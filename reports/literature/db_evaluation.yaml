- id: hsieh2024ruler
  title: "RULER: What's the Real Context Size of Your Long-Context Language Models?"
  authors: "Cheng-Ping Hsieh, Simeng Sun, Samuel Kriman, Shantanu Acharya, Dima Rekesh, Fei Jia, Yang Zhang, Boris Ginsburg"
  year: 2024
  venue_or_status: "arXiv 2404.06654"
  url: "https://arxiv.org/html/2404.06654"
  code_url: "https://github.com/NVIDIA/RULER (commit db43f92ff634bbce1c33d1fb15858aec4bba509a)"
  access_level: "[code-inspected]"
  research_question: "Does vanilla NIAH overstate long-context ability; what is effective context length across task types?"
  mechanism: "Synthetic, configurable tasks: NIAH variants (single/multi-key/multi-value/multi-query), variable tracking, common/frequent word extraction, QA with distractor docs."
  manipulated_vars: "task type, needle/haystack types, #keys/values/queries, context length 4K-128K"
  controlled_vars: "500 samples/task/length; greedy decoding; answer prefix"
  model_sizes_and_training: "17 public long-context LMs (6B-104B + GPT-4, Gemini); also RWKV-v5, Mamba-2.8B"
  benchmarks: "13 RULER tasks"
  main_findings: "Near-perfect vanilla NIAH but large degradation with length on full suite; effective length threshold = Llama2-7B 4K avg 85.6%; RWKV/Mamba degrade by 8K; larger models degrade less. Code: length fitted by binary search to <= max_seq_length (not exact); depth from 40 linspace levels; metric string_match_all; CWE params switch to 6/1 below 4K."
  limitations: "Paper [read-section] (appendix truncated). Instruction-style prompts unsuitable for small base LMs; niah_single_1 (noise haystack, one number) and vt (1 chain, noise haystack) are shortcut-solvable (my inference from code)."
  relevance_to_us: "high — task taxonomy, knobs and word lists to borrow; shortcut pitfalls to avoid"
  reproducible_or_adaptable: "Adaptable: reuse task logic/word lists (Apache-2.0) in custom token-space generator"

- id: arora2023zoology
  title: "Zoology: Measuring and Improving Recall in Efficient Language Models"
  authors: "Simran Arora, Sabri Eyuboglu, Aman Timalsina, Isys Johnson, Michael Poli, James Zou, Atri Rudra, Christopher Ré"
  year: 2023
  venue_or_status: "arXiv 2312.04927 (later ICLR 2024 per repo configs naming; venue not verified on arXiv page)"
  url: "https://arxiv.org/abs/2312.04927"
  code_url: "https://github.com/HazyResearch/zoology (commit 1ad20d193b6113cae1e8f3c655c300d7b4b3f4bb)"
  access_level: "[code-inspected]"
  research_question: "Why do gated-convolution LMs lag attention; can associative recall explain it?"
  mechanism: "AR-hit perplexity slice on Pile; MQAR synthetic; theory on model dim vs seq len"
  manipulated_vars: "sequence mixer (attention, H3, Hyena, RWKV, BaseConv, hybrids), scale 70M/160M/360M, MQAR seq len and #KV"
  controlled_vars: "Pile, 10B tokens, Llama-style recipe"
  model_sizes_and_training: "70M-360M for 10B tokens; 1.4B for 50B tokens"
  benchmarks: "Pile PPL sliced into AR hits (6.4% tokens; bigram previously in context and <=1250x in training) vs other; MQAR"
  main_findings: "AR hits explain 82% of PPL gap; 70M attention beats 1.4B Hyena on AR-hit PPL (2.41 vs 3.43); gated convs need d scaling with seq len for MQAR; BaseConv + 3 attention layers beats Transformer at 360M. MQAR generator: keys vocab[1:V/2], values vocab[V/2:], power-law query gaps (power_a=0.01), random non-query filler, V=8192."
  limitations: "Paper [read-section] via PDF text. AR-hit heuristic is bigram-based; not long-range specific (no distance resolution)."
  relevance_to_us: "high — AR-hit slice is a validated zero-shot recall metric at 70M; MQAR generator for capacity probes"
  reproducible_or_adaptable: "Adaptable: distance-resolved repeat-token loss (LM-3); MQAR-in-text (R2)"

