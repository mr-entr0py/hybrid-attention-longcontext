  benchmarks: '[nemotron] MMLU, MMLU-Pro, GSM8K, MATH, HumanEval(+), MBPP(+), ARC-C, HellaSwag, Winogrande, PIQA, OBQA; VLM suite; reasoning suite (AIME25, GPQA, LCB, BFCL, IFEval, Arena-Hard); RULER 128K (post-trained, ~83%). || [architecture] standard'
  main_findings: '[nemotron] 8B hybrid is higher than the same-data Transformer on 7/15 tasks and within 1 point on 4 more; 56B beats Llama-3.1-70B on 16/17 tasks; up to 3x throughput at 65K input / 1K output on H100 (Megatron inference for Nemotron-H vs vLLM 0.7.3 for baselines); layer-importance MSE shows some attention layers among the least important (e.g. layer 84 in the 56B) and others locally important (40, 51, 62, 73); pruning to 5/10 attention is near-lossless on SHORT-context benchmarks; Mamba head pruning hurts badly. || [architecture] Up to 3x faster inference at parity with Qwen-2.5/Llama-3.1. || [implementation] Not a controlled full-vs-linear ratio experiment; cite only as an architecture example.'
