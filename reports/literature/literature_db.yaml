  relevance_to_us: '[architecture] high — closest controlled ratio sweep; same library (FLA) and mechanisms; gives prior on knee location (between 12:1 and 6:1) || [evaluation] high — closest controlled-ratio prior; direct evidence zero-shot RULER is at floor below ~340M || [methodology] high — closest controlled ratio study; our protocol adds seeds, CIs, LR fairness, placement and cost measurement. || [implementation] high: the closest controlled ratio study. Our study extends it to 1K-32K contexts, placement, task types, and measured cost at 20-60M scale. Supports choosing GDN.'
  reproducible_or_adaptable: '[architecture] adaptable — FLA configs; we extend to all-full endpoint, per-task, 1K-32K, placement || [evaluation] Checkpoints could serve as external anchors || [methodology] adaptable (checkpoints released) || [implementation] Adaptable: uses fla; checkpoints released.'
  ratio_evidence: controlled-from-scratch sweep (340M/1.3B; pure, 24:1, 12:1, 6:1, 3:1 + Transformer; RULER averaged; no seeds; param matching not stated)
  pi_notes: 'PI re-check 2026-11-09 via WebFetch of https://arxiv.org/html/2507.06457v1 and v2 [read-section: Limitations, Appendix D, Tables 2/5/7]. (a) Context length: v1 Limitations says ''a 2,048-token context window''; v2 Limitations says ''a 4,096-token context window''; neither version states the pretraining sequence length in the setup -> the agents'' 2K-vs-4K disagreement is a version difference, unresolved by the source. (b) Placement: v2 Appendix D ''interleave ... in a fixed ratio r:1 (linear : full), repeating the composite block N times''; Fig. 6 ''linear-attention followed by full-attention'' -> full layer at the END of each block. (c) No statement of parameter matching across ratios, no hidden size/layer counts, no seeds/CIs/error bars, LR value not stated, RULER lengths and sample counts not stated. (d) Table 7 (avg of DeltaNet, GDN, GLA, HGRN2): pure 0.256, 24:1 0.338, 12:1 0.340, 6:1 0.390, 3:1 0.397 (no Transformer row; caption does not say which scale); Transformer 0.423 is in Table 5. (e) v1 Table 2 caption: ''340M models show insignificant recall capability''.'
