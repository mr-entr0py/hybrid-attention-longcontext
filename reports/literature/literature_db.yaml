  relevance_to_us: '[nemotron] high for H3 / H4 (task-specific critical layers), but the regime differs from our from-scratch sweep. || [architecture] high — task-dependent placement (H3/H4) and GDN as best linear block || [implementation] high for RQ-B/H4 (placement matters and is task-dependent) and RQ-C; adaptable placements (mid/late) for our placement arm.'
  reproducible_or_adaptable: '[nemotron] Adaptable: the per-layer ''single full-attention layer'' probing idea can be applied to our trained models post hoc. || [architecture] configs inspectable; method not reproducible at our budget || [implementation] Placements adaptable; NAS not reproduced.'
