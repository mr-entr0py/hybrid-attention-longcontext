  mechanism: '[nemotron] Replace most self-attention layers with Mamba-2 (constant per-token state). ~8% of layers are GQA attention (8 KV heads), evenly dispersed, each followed by an FFN; the remaining layers are alternating Mamba-2 and squared-ReLU FFN; first layer Mamba-2, last layer FFN; no position embeddings. || [architecture] mix of self-attention, Mamba-2 and MLP layers || [implementation] Mix of attention, Mamba-2 and MLP layers'
