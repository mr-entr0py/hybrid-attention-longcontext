  model_sizes_and_training: '[architecture] 72 models: 340M/20B tokens (50k-token batch) and 1.3B/100B tokens (1M batch) || [evaluation] 72 models, 340M and 1.3B || [methodology] 340M/20B tokens (50k-token batch); 1.3B/100B tokens (1M batch) || [implementation] 72 models: 36 at 340M/20B tokens (about 50K-token batch), 36 at 1.3B/100B tokens (about 1M-token batch); 2,048-token context'
  benchmarks: '[architecture] ARC-c/e, HellaSwag, LAMBADA, OBQA, PIQA; RULER (retrieval, multi-hop tracing, aggregation, QA) averaged || [evaluation] zero-shot ARC-c/e, HellaSwag, LAMBADA, OBQA, PIQA; RULER subsets (MK, MQ, MV, SV, CWE+FWE, QA, VT) || [implementation] Commonsense LM tasks; RULER (multikey, multiquery, multivalue, singlevalue, CWE+FWE, QA, VT)'
  main_findings: '[architecture] LM average flat across ratios (0.472-0.480). RULER recall average pure 0.256, 24:1 0.338, 12:1 0.340, 6:1 0.390, 3:1 0.397. GDN pure 0.356 -> 3:1 0.436; GLA 0.144 -> 0.332; HGRN2 0.203 -> 6:1 0.434. Transformer RULER 0.423 vs GDN-3:1 0.440. Standalone strength does not predict hybrid strength; recommends HGRN2 or GDN at 3:1-6:1. || [evaluation] 1.3B RULER avg: pure-linear 0.256, 24:1 0.338, 12:1 0.340, 6:1 0.390, 3:1 0.397, Transformer ~0.42; LM avg flat 0.472-0.480; 340M recall ''insignificant'' and omitted; recommends 3:1-6:1 with GatedDeltaNet/HGRN-2. || [methodology] LM stable across ratios; recall improves with more full attention, especially below 3:1; recommend HGRN-2 or GatedDeltaNet at 3:1-6:1. || [implementation] LM average roughly flat across ratios (about 0.472-0.480). RULER recall average 0.256 pure linear, 0.338 at 24:1, 0.390 at 6:1, 0.397 at 3:1. The best standalone linear model is not the best hybrid partner. Gated variants (HGRN-2, GatedDeltaNet) are best when hybridised. Recommends a 3:1 to 6:1 ratio.'
