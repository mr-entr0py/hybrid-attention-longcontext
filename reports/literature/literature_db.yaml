  url: https://github.com/fla-org/flash-linear-attention
  code_url: https://github.com/fla-org/flash-linear-attention (commit 98193113ecb7, 2026-11-08)
  access_level: '[code-inspected]'
  access_detail: 'architecture: [code-inspected]; methodology: [code-inspected]; implementation: [code-inspected]'
  research_question: '[architecture] n/a (library) || [methodology] Triton kernels for linear attention variants. || [implementation] n/a (software)'
  mechanism: '[architecture] GatedDeltaNet, GLA, Mamba2, HGRN2, RetNet, DeltaNet, KDA, RWKV7, attention; hybrid via config attn={''layers'':[...]} || [methodology] Chunked/fused-recurrent Triton kernels; cu_seqlens varlen support. || [implementation] Chunked parallel and fused-recurrent Triton kernels (gated delta rule etc.). HF-compatible models. Hybrid via config attn={''layers'':[...], ...}. Varlen via cu_seqlens. FLA Cache with recurrent_state/attn_state/conv_state.'
  model_sizes_and_training: 'VERIFIED-HERE on RTX 5080 with torch 2.11.0+cu128, triton 3.6.0: GDN fwd/bwd, exact varlen document isolation, prefill+recurrent decode matching full forward (fp32 argmax agreement 1.0), 49.4M hybrid trains at about 60-100k tok/s (shared GPU, B=1x4096).'
  main_findings: '[architecture] GDN default ~6d^2 params (0.75d key dim, expand_v 2); param-matched config head_dim 64, num_heads d/128, expand_v 2 -> 4.03d^2 (measured). Short conv k=4 ''crucial''. Chunk kernel fp32 final state. fused_recurrent positional signature (q,k,v,g,gk,gv,beta,...) — must use keywords. FLA Attention requires flash_attn (not installed) and rope_theta>0 in hybrid config (no NoPE). Kernels verified on RTX 5080 sm_120 (torch 2.11, triton 3.6): GDN chunk err vs naive fp32 2.9e-4 (fp32), 1.2e-3 (bf16). || [methodology] GatedDeltaNet defaults: hidden 2048, head_dim 256, 6 heads, expand_v 2, short conv, output gate (~6 d^2 params vs 4 d^2 MHA); A_log/dt_bias excluded from weight decay; Triton autotune (FLA_CACHE_MODE default disabled, FLA_CACHE_RESULTS=1); TF32 used when supported; no tl.atomic_add in ops/gated_delta_rule or ops/common (present in path_attn, atk, cyfa, log_linear_attn, utils/csr). || [implementation] Blackwell handling: SM120 detection, global-scratch allocator, inline-asm tl.dot workaround (issue #638), 8-warp configs dropped for Triton<3.8, wy_fast bwd num_warps=[2]. fla.layers.attn.Attention hard-requires the flash_attn package. Recurrent state stored in fp32. fla requires transformers>=5.6.2.'
  limitations: '[architecture] Mamba2 falls back to naive/Triton paths without mamba_ssm/causal_conv1d || [methodology] Autotune choices can differ across processes (esp. under GPU contention). || [implementation] Attention layer depends on flash-attn (no wheel for torch 2.11); work around by patching module functions or writing our own attention. torch.compile of whole models recompiles per layer (layer_idx). Cache not compileable.'
  relevance_to_us: '[architecture] high — implementation substrate || [methodology] high — determinism policy, parameter matching, varlen state reset. || [implementation] high: core dependency for the linear mixer.'
  reproducible_or_adaptable: '[methodology] reproducible || [implementation] Yes. pip install flash-linear-attention==0.6.0 (VERIFIED-HERE).'
  pi_notes: 'PI code check @98193113 fla/layers/gated_deltanet.py: the ''crucial'' warning (L190-191) refers to ShortConvolution (''ShortConvolution is crucial to the performance. Do not turn it off...''), NOT to the output gate; defaults use_gate=True, expand_v=2, head_dim=256, num_heads=6. PI meta-device instantiation at d=512: config A (head_dim 64, 4 heads, expand_v 2, gate on) 1,056,904 params (+0.79% vs MHA 1,048,576), state 4x64x128 fp32 = 128 KiB; config B (head_dim 128, 4 heads, expand_v 1, gate off) 1,058,952 (+0.99%), state 256 KiB; config C (head_dim 128, 4 heads, expand_v 1, gate on) 1,321,096 (+25.99%); config D (head_dim 128, 2 heads, expand_v 2, gate on) 1,054,980 (+0.61%), state 256 KiB.'
