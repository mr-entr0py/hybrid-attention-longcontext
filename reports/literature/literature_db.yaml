  main_findings: '[nemotron] Only 2 (MMLU) or 2-3 (retrieval) attention layers are critical; the layers that matter differ by task; learned placement significantly beats uniform placement; 2B gets up to 53.6x decode / 6.1x prefill speedup vs Qwen3-1.7B at 256K (theoretical max 56x). || [architecture] ~2 layers critical for MMLU, 2-3 for retrieval, and they differ. Block comparison retrieval: GDN 69.3, Mamba2 68.9, DeltaNet 67.9, GLA 66.6, RetNet 63.7; RWKV7 excluded for low throughput. KV cache size is the main throughput determinant. Code: 2B full attn at layers {14,19}, SWA(1152) {20,21} of 28; 4B full {17,20,32}, SWA {5,16,19,21,22,25,27} of 36. || [implementation] Only 2 layers critical for MMLU and 2-3 for retrieval; important layers differ by task. 2B config: full attention at 0-indexed layers 14 and 19, SWA (window 1152) at 20 and 21. 4B repo config: full at 17, 20, 32; SWA (2048) at 5, 16, 19, 21, 22, 25, 27 (matches paper text; Table 9 differs). Claims up to 53.6x generation and 6.1x prefill throughput.'
