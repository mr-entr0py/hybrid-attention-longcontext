- id: bouthillier2021variance
  aliases: []
  reported_by:
  - methodology
  title: Accounting for Variance in Machine Learning Benchmarks
  authors: Bouthillier, Delaunay, Bronzi, Trofimov, Nichyporuk, Szeto, Sepah, Raff, Madan, Voleti, Kahou, Michalski, Serdyuk, Arbel, Pal, Varoquaux, Vincent
  year: 2021
  venue_or_status: MLSys 2021 (arXiv:2103.03098)
  url: https://arxiv.org/abs/2103.03098
  access_level: '[read-section]'
  access_detail: 'methodology: [read-section]'
  research_question: Which sources of variance affect ML benchmark conclusions and how should two pipelines be compared under a budget?
  mechanism: Randomize seeds of each variance source 200x; simulate decision criteria (single point, average, P(A>B) test).
  manipulated_vars: data bootstrap, data augmentation, data order, weight init, dropout, numerical noise, HPO procedure
  controlled_vars: all other sources fixed while one varies; fixed hardware per task
  model_sizes_and_training: 5 case studies (e.g., BERT on GLUE RTE/SST-2, VGG11 CIFAR-10, others)
  benchmarks: GLUE-RTE, GLUE-SST2, CIFAR-10 and others
  main_findings: Data sampling is the largest variance source; init variance generally <50% of bootstrap variance, on par with data order; adding more variance sources improves estimator (51x cheaper biased estimator); single-point comparisons ~10% FP and ~75% FN; recommend P(A>B) with gamma=0.75, significant if CI lower bound >0.5.
  limitations: Classification-centric; few datasets; appendices not read by me.
  relevance_to_us: high — justifies randomizing init+data order per seed, bootstrapping eval items, and P(A>B) as practical-significance companion.
  reproducible_or_adaptable: adaptable (decision rule directly usable)
