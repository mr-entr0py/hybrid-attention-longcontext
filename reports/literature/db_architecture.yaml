- id: waleffe2024empirical_mamba
  title: "An Empirical Study of Mamba-based Language Models"
  authors: "Roger Waleffe et al. (NVIDIA)"
  year: 2024
  venue_or_status: "arXiv 2406.07887"
  url: "https://arxiv.org/html/2406.07887"
  code_url: "https://github.com/NVIDIA/Megatron-LM"
  access_level: "[read-section]"
  research_question: "Mamba/Mamba-2 vs Transformer at 8B; optimal hybrid composition"
  mechanism: "Mamba-2 + self-attention (GQA, NoPE) + MLP"
  manipulated_vars: "attention fraction and MLP fraction (130M/840M); RoPE vs none"
  controlled_vars: "data, tokens, size per comparison"
  model_sizes_and_training: "130M/840M ablations; 8B on 1.1T and 3.5T tokens; 16K/32K/128K extensions"
  benchmarks: "12 short tasks, MMLU, Phonebook, RULER, long-context tasks"
  main_findings: "~8% attention best by val loss; MLP 30-50% fine. 8B hybrid: 24 Mamba-2 + 4 attn + 28 MLP, first layer Mamba-2, attn evenly spread, NoPE. Hybrid avg 55.82 vs 53.17; MMLU 53.60 vs 50.07; RULER@16K 74.19 vs 62.33; phonebook 100% to ~5.5K. Pure SSM phonebook fails from ~500 tokens. Transformers slightly better on natural long-context (multi-doc QA)."
  limitations: "fraction sweep values only in figure; mixes MLP-fraction changes"
  relevance_to_us: "high — attention-fraction optimum, placement rule (first layer recurrent), NoPE choice, task-dependent long-context results"
  reproducible_or_adaptable: "adaptable"

