- id: wang2025systematic_hybrid_linear
  title: "A Systematic Analysis of Hybrid Linear Attention"
  authors: "Dustin Wang, Rui-Jie Zhu, Steven Abreu, Yong Shan, Taylor Kergan, Yuqi Pan, Yuhong Chou, Zheng Li, Jibin Wu, Ge Zhang, Wenhao Huang, Jason Eshraghian"
  year: 2025
  venue_or_status: "arXiv 2507.06457 (v2 2026-06-24)"
  url: "https://arxiv.org/html/2507.06457v2"
  code_url: ""
  access_level: "[read-section]"
  research_question: "How does the choice of linear-attention component and the linear:full ratio affect hybrid LM quality and recall?"
  mechanism: "DeltaNet, GatedDeltaNet, GLA, HGRN, HGRN2, RetNet interleaved with softmax attention"
  manipulated_vars: "linear mechanism (6); ratio linear:full in {24:1, 12:1, 6:1, 3:1, pure}"
  controlled_vars: "scale, data (fineweb-edu), tokens, optimizer (AdamW cosine), FLA library, ctx 4096"
  model_sizes_and_training: "72 models: 340M/20B tokens (50k-token batch) and 1.3B/100B tokens (1M batch)"
  benchmarks: "ARC-c/e, HellaSwag, LAMBADA, OBQA, PIQA; RULER (retrieval, multi-hop tracing, aggregation, QA) averaged"
  main_findings: "LM average flat across ratios (0.472-0.480). RULER recall average pure 0.256, 24:1 0.338, 12:1 0.340, 6:1 0.390, 3:1 0.397. GDN pure 0.356 -> 3:1 0.436; GLA 0.144 -> 0.332; HGRN2 0.203 -> 6:1 0.434. Transformer RULER 0.423 vs GDN-3:1 0.440. Standalone strength does not predict hybrid strength; recommends HGRN2 or GDN at 3:1-6:1."
  limitations: "4K context only; placement positions unspecified; RULER averaged (no per-task curve); text/table inconsistencies (claims 'nearly doubles' recall vs 0.338->0.397); observational, no seeds reported in what I read."
  relevance_to_us: "high — closest controlled ratio sweep; same library (FLA) and mechanisms; gives prior on knee location (between 12:1 and 6:1)"
  reproducible_or_adaptable: "adaptable — FLA configs; we extend to all-full endpoint, per-task, 1K-32K, placement"

- id: bae2025hybrid_meta
  title: "Hybrid Architectures for Language Models: Systematic Analysis and Design Insights"
  authors: "Sangmin Bae, Bilge Acun, Chien-Yu Lin, Haroun Habeeb, Seungyeon Kim, Liang Luo, Junjie Wang, Carole-Jean Wu"
  year: 2025
  venue_or_status: "arXiv 2510.04800 (v3)"
  url: "https://arxiv.org/html/2510.04800"
  code_url: ""
  access_level: "[read-section]"
  research_question: "Inter-layer vs intra-layer Transformer/Mamba-2 hybrids: ratio, placement, fusion, scaling"
  mechanism: "Mamba-2 (SSD) + softmax attention (RoPE theta 500k, Llama-3 scaling); SWA baseline"
  manipulated_vars: "Transformer:Mamba ratio {1:0,1:1,1:3,1:5,1:12,0:1}; placement Front/Middle/End; intra-layer head split; fusion"
  controlled_vars: "params, tokens (60B), ctx 8K, recipe"
  model_sizes_and_training: "100M-3B; ablations at 350M (14-layer Llama, d1536) and 1B (16 layers, d2048), 60B tokens; iso-FLOP 4.5e20"
  benchmarks: "DCLM and PG19 loss, few-shot average, NIAH 960-16320 tokens"
  main_findings: "1B: Transformer 2.750/2.875/52.0; Mamba 2.758/2.891/52.3; 1:1 2.725/2.847/54.0; 1:3 2.733/2.859/54.0; 1:5 2.735/2.861/53.3; 1:12 2.741/2.866/53.1. Placement Table 11 differences <=0.004 nats (front said worst; middle recommended). Transformer NIAH ~0 beyond 8K; hybrids ok to ~1.5x train length. Recommends ~1:5 for efficiency, 1:1 for quality."
  limitations: "NIAH only in figures; placement effects tiny and mixed; cache-size figure inconsistent with stated GQA config"
  relevance_to_us: "high — controlled ratio + placement study (with Mamba-2), gives placement prior and non-monotonic loss"
  reproducible_or_adaptable: "adaptable — placement cells (front/middle/end) reused in our design"

- id: qiao2026rethinking_efficient_attention
  title: "Rethinking the Role of Efficient Attention in Hybrid Architectures"
  authors: "Ziqing Qiao, Yinuo Xu, Chaojun Xiao, Zhou Su, Zihan Zhou, Yingfa Chen, Xiaoyue Xu, Xu Han, Zhiyuan Liu"
  year: 2026
  venue_or_status: "arXiv 2606.15378v1"
  url: "https://arxiv.org/html/2606.15378v1"
  code_url: "https://github.com/thunlp/rethinking-hybrid-attention"
  access_level: "[read-section]"
  research_question: "Does the efficient layer carry long-range information in hybrids, or does full attention?"
  mechanism: "SWA-128/512/2048, Lightning, Mamba-2, GDN alternated 1:1 with full attention"
  manipulated_vars: "efficient-attention type; scale; tokens; 1:1 vs 1:3; head-wise vs layer-wise; NoPE on full layers"
  controlled_vars: "data mix, ctx 16K, Muon, WSD"
  model_sizes_and_training: "non-embedding 15M, 31M, 65M, 104M, 477M; D up to 1000N tokens; S4/S5 ~100B tokens; S5 +5B tokens at 32K (RoPE base 1e5 -> 5e5)"
  benchmarks: "C4 val loss, log LongPPL (GovReport), RULER, RULER-NIAH, LongBench, 19 short tasks"
  main_findings: "Hybrid val-loss curves overlap Full. Restricting full attention to 2048 sharply hurts LongPPL; restricting efficient layers barely matters (even GDN). Retrieval probing gains at middle full layers. S4 16K Full/SWA-128/SWA-128-NoPE: RULER 25.09/35.33/44.80, NIAH 35.95/49.58/67.81. S5 32K RULER 43.90/41.86/46.98. 1:3 similar loss, worse LongPPL at small scale."
  limitations: "ratio only 1:1 vs 1:3; GDN/Mamba2 RULER numbers not in text I read; trains at 16K directly"
  relevance_to_us: "high — same parameter scale as us (15M-104M), 16K-32K, NoPE result, Muon hyperparameters"
  reproducible_or_adaptable: "adaptable — code released; their LR/batch table is a direct hyperparameter prior"

- id: kimi2025linear
