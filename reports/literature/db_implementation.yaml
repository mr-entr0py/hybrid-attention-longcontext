- id: gu2025_jet_nemotron
  title: "Jet-Nemotron: Efficient Language Model with Post Neural Architecture Search"
  authors: "Yuxian Gu, Qinghao Hu, Shang Yang, Haocheng Xi, Junyu Chen, Song Han, Han Cai"
  year: 2025
  venue_or_status: "NeurIPS 2025 (per repo README); arXiv 2508.15884"
  url: "https://arxiv.org/abs/2508.15884"
  code_url: "https://github.com/NVlabs/Jet-Nemotron (commit 94cbd1240463)"
  access_level: "[read-section] (HTML PostNAS section via fetch summary); [code-inspected] (configs)"
  research_question: "Which full-attention layers to keep when converting a pretrained Transformer to a hybrid (PostNAS)"
  mechanism: "Freeze MLPs; once-for-all supernet with alternative linear paths; beam search over full-attention placement under a budget with task-specific objectives; JetBlock linear attention with dynamic conv"
  manipulated_vars: "Placement of full/SWA layers; linear block design; hyperparameters"
  controlled_vars: "Pretrained MLPs (Qwen2.5 base)"
  model_sizes_and_training: "Jet-Nemotron-2B (28 layers, from Qwen2.5-1.5B), 4B (36 layers)"
  benchmarks: "MMLU(-Pro), math, retrieval, throughput"
  main_findings: "Only 2 layers critical for MMLU and 2-3 for retrieval; important layers differ by task. 2B config: full attention at 0-indexed layers 14 and 19, SWA (window 1152) at 20 and 21. 4B repo config: full at 17, 20, 32; SWA (2048) at 5, 16, 19, 21, 22, 25, 27 (matches paper text; Table 9 differs). Claims up to 53.6x generation and 6.1x prefill throughput."
  limitations: "Post-training conversion from a pretrained Transformer, not from-scratch training at fixed ratio; placement chosen by search."
  relevance_to_us: "high for RQ-B/H4 (placement matters and is task-dependent) and RQ-C; adaptable placements (mid/late) for our placement arm."
  reproducible_or_adaptable: "Placements adaptable; NAS not reproduced."

