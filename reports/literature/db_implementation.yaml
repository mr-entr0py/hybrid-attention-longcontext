  model_sizes_and_training: "VERIFIED-HERE on RTX 5080 with torch 2.11.0+cu128, triton 3.6.0: GDN fwd/bwd, exact varlen document isolation, prefill+recurrent decode matching full forward (fp32 argmax agreement 1.0), 49.4M hybrid trains at about 60-100k tok/s (shared GPU, B=1x4096)."
