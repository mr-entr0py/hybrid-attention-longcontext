- id: wang2025_systematic_hybrid_linear_attention
  title: "A Systematic Analysis of Hybrid Linear Attention"
  authors: "Dustin Wang, Rui-Jie Zhu, Steven Abreu, Yong Shan, Taylor Kergan, Yuqi Pan, Yuhong Chou, Zheng Li, Ge Zhang, Wenhao Huang, Jason Eshraghian"
  year: 2025
  venue_or_status: "arXiv 2507.06457"
  url: "https://arxiv.org/abs/2507.06457"
  code_url: "https://huggingface.co/collections/m-a-p/hybrid-linear-attention-research-686c488a63d609d2f20e2b1e (models); trained with https://github.com/fla-org/flash-linear-attention"
  access_level: "[read-section]"
  research_question: "Which linear-attention variants make good hybrids, and how does the linear:full ratio affect LM quality and recall?"
  mechanism: "Block-wise hybrid: r linear layers followed by 1 full softmax-attention layer, repeated."
  manipulated_vars: "Linear variant (HGRN, HGRN-2, GLA, RetNet, DeltaNet, Gated DeltaNet); ratio 24:1, 12:1, 6:1, 3:1, pure linear, plus Transformer baseline"
  controlled_vars: "Data (FineWeb-Edu), size tier, token budget, AdamW + cosine. Parameter matching across ratios not stated."
  model_sizes_and_training: "72 models: 36 at 340M/20B tokens (about 50K-token batch), 36 at 1.3B/100B tokens (about 1M-token batch); 2,048-token context"
  benchmarks: "Commonsense LM tasks; RULER (multikey, multiquery, multivalue, singlevalue, CWE+FWE, QA, VT)"
  main_findings: "LM average roughly flat across ratios (about 0.472-0.480). RULER recall average 0.256 pure linear, 0.338 at 24:1, 0.390 at 6:1, 0.397 at 3:1. The best standalone linear model is not the best hybrid partner. Gated variants (HGRN-2, GatedDeltaNet) are best when hybridised. Recommends a 3:1 to 6:1 ratio."
  limitations: "Authors: up to 1.3B, 2,048-token context, block-wise ratios only. Placement is not varied independently. No efficiency measurement in the summary I read. Param matching unclear."
  relevance_to_us: "high: the closest controlled ratio study. Our study extends it to 1K-32K contexts, placement, task types, and measured cost at 20-60M scale. Supports choosing GDN."
  reproducible_or_adaptable: "Adaptable: uses fla; checkpoints released."

- id: yang2025_gated_deltanet
  title: "Gated Delta Networks: Improving Mamba2 with Delta Rule"
  authors: "Songlin Yang, Jan Kautz, Ali Hatamizadeh"
  year: 2025
  venue_or_status: "ICLR 2025 (per NVlabs repo README); arXiv 2412.06464"
  url: "https://arxiv.org/abs/2412.06464"
  code_url: "https://github.com/NVlabs/GatedDeltaNet (commit b53d6d3a1612)"
  access_level: "[abstract-only] (paper); [code-inspected] (repo)"
  research_question: "Combine gating (fast erase) and the delta rule (targeted update) in a linear recurrent layer with chunked parallel training."
  mechanism: "Gated delta rule state update S_t = a_t S_{t-1} (I - b_t k_t k_t^T) + b_t v_t k_t^T, with short conv, L2-normalised q/k, and output gate."
  manipulated_vars: "Architecture (GDN vs Mamba2/DeltaNet); hybrids GDN+SWA (H1) and GDN+Mamba2+SWA (H2)"
  controlled_vars: "Data and token budget within comparisons"
  model_sizes_and_training: "Repo configs: GatedDeltaNet_0.4B (11 layers, d=1536), H1_0.4B (12 layers, d=1536, gated_delta_per_layer=2, SWA window 2048), 1.3B variants. Scripts train 15B tokens at 4K context on SlimPajama (paper used FineWeb-Edu)."
  benchmarks: "LM, commonsense, in-context retrieval, length extrapolation, long-context understanding (per abstract)"
  main_findings: "Abstract: consistently beats Mamba2 and DeltaNet. Hybrids with SWA or Mamba2 improve further."
  limitations: "Its hybrids use sliding-window (local) attention, not global full attention, so this is a different manipulation from ours. The repo is a lit-gpt/Slurm multi-node codebase."
  relevance_to_us: "high: GDN is our recommended linear mixer. Use fla kernels, not this repo (the README itself recommends fla for speed and varlen)."
  reproducible_or_adaptable: "Use the fla implementation."

