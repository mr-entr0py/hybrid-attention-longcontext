# R2-LIVE v2: single GPU queue (R2(a)) and per-run infrastructure tagging (R2(b)) live project-wide.
# Pre-registration (PI FINAL rulings, 2026-11-10; written before any R2-LIVE check ran).
# Supersedes R2_live.yaml v1 (never ran; stays on record unchanged).
id: R2-LIVE
version: 2
supersedes: "R2_live.yaml v1, sha256 125893126a64f19ea44a0281532e98d33bc45d3ee7285373c752468b39df0e16"
why_v2: >-
  Review O14 and O10: (1) a C2 violation must invalidate the gate or timed run in whose window it falls, as plan
  §2.2(a) requires ("No two project GPU processes run during a timed or gate run"), and C2 must not be re-judged
  indefinitely; (2) the tagging carries the PR-27 v2 classification (infra vs suspected software failure); (3) the
  compliance window now starts at the first Phase II GPU job (O4-Z).
relation: >-
  R2(a) and R2(b) FAILED as registered: the plan's pass rule "(a) and (b) live before R4 starts" was not met
  (R4 started 07:33:15; audit_R2-R7.md §1.1). That FAIL stays on record (residual RR-R2 for the runs already made).
  R2-LIVE is a NEW check of the state after the fix (route ii); G-RV's state condition "R2 (a) and (b) live" is
  judged on it, and the gate reports it as "MET via new check", never as an R2 PASS.
owners: "orchestrator (policy, launch scripts); S0 training/runner (trainer, runner, gpumon, queue); eval (evaluate.py); tests (conftest)"

implementation_requirements:   # must be merged before C1 runs
  L1_lock:
    - "One lock: runs/gpu_queue.lock (fcntl.flock; HYBRIDLC_GPU_LOCK may override only inside tests). Move the logic of scripts/repro/gpu_lock.py into src/hybridlc/utils/gpu_lock.py (keep the script as a thin CLI)."
    - "Every entry point that creates a CUDA context acquires the lock, or verifies that it descends from the current holder through an inherited token (env HYBRIDLC_GPU_LOCK_TOKEN matching the holder file), BEFORE its first CUDA call, and otherwise exits with code 78 and a one-line message: scripts/train.py, scripts/runner.py (acquires per job; children inherit the token), scripts/evaluate.py, scripts/g0_throughput.py, scripts/bench_train_step.py, scripts/benchmark_inference.py, scripts/warm_triton.py, scripts/vt13_production_resume.py, every GPU driver in scripts/repro/ and scripts/s1_zoology/."
    - "pytest: new tests/conftest.py acquires the lock once per session iff any collected test is gpu-marked or requests CUDA; CPU-only sessions never lock. The same conftest sets TRITON_CACHE_DIR=$REPO/.cache/triton-diag unless already set to a non-production dir."
    - "Escape hatch HYBRIDLC_GPU_UNLOCKED=1 only for labelled debug runs that write no registry row; the trainer refuses it for any exp_stage S2..S8 run and for reproduction gate runs."
    - "Wait policy: --wait-exclusive semantics (also wait until no other project process holds a CUDA context) for every timed or gate run."
  L2_tagging:
    - "Move scripts/repro/infra_events.py logic (kernel_events, InfraTagger) into src/hybridlc/utils/infra.py with tests; keep the script as CLI. Add the PR-27 v2 classifier: classification in {none, infra, suspect_sw} per event and per attempt (infra: Xid 8 with RC watchdog or a cudaErrorLaunchTimeout matched to such a line, Xid 79, host OOM-kill by the kernel or systemd-oomd; suspect_sw: Xid 13, 31, 43, and CUDA illegal address / illegal instruction / misaligned address without an RC-watchdog line; any other Xid: suspect_sw)."
    - "Trainer: runs/<id>/summary.json gains block 'infra' = {window: [start, end], events: [...], classification, flagged, journal_ok, oomd_ok, foreign_gpu_processes: [...], unlocked_project_processes: [...], lock_wait_s}. Every terminal registry row (completed, failed, oom, diverged) carries infra_flagged, infra_class, journal_ok, n_infra_events."
    - "Runner: after every attempt, including attempts killed by a CUDA error or signal (where the trainer cannot write), append registry row 'attempt_end' with the same block, the exit code, the last completed optimizer step and the attempt number."
    - "scripts/evaluate.py: same block in every _eval_log.jsonl record and every result _meta.json."
  L3_monitor:
    - "training/gpumon.py samples compute apps every 5 s during any locked job and records, per project CUDA process, whether it is the lock holder or a descendant (/proc ancestry) -> field lock_ok."

checks:
  C1_tests:   # tests/test_r2_live.py (+ scripts/repro/test_r2_tooling.py kept green)
    - "Two concurrent scripts/train.py smoke runs (tiny config or training.fakes, 20 steps, separate scratch roots) serialise: their CUDA windows do not overlap and the second records lock_wait_s > 0."
    - "A GPU entry point started without the lock and without the escape hatch exits 78 before creating a CUDA context (assert torch.cuda.is_initialized() is False at exit, via a subprocess probe)."
    - "A pytest session with a gpu-marked test holds the lock for its duration; a CPU-only session does not acquire it."
    - "With a monkeypatched journal source injecting one 'NVRM: Xid (PCI:...): 8, pid=..., name=python, channel 0x00000003' line plus an 'RC watchdog' line inside the window, a fake trainer run (training.fakes) writes infra.flagged = true, classification = infra and n_infra_events = 2 into summary.json and into its terminal registry row; with an empty journal flagged = false and journal_ok = true; with an unreadable journal journal_ok = false."
    - "Classifier table: Xid 8 + RC watchdog -> infra; Xid 79 -> infra; host OOM-kill line -> infra; Xid 13, 31, 43 -> suspect_sw; 'illegal memory access' CUDA error without RC watchdog -> suspect_sw; unknown Xid -> suspect_sw."
    - "The runner writes an attempt_end row with the infra block for an attempt whose child is SIGKILLed."
  C2_live_window:
    window: "from the start of O4-Z (the first Phase II GPU job) to the end of SUITE-PF, covering O4-Z, O4-B, O4-A, TC-PF, FEAS-SMOKE, R2e-X, VT-13r, VT-22b, VT-23b, R6 and SUITE-PF"
    requirements:
      - "zero gpumon samples (5-s cadence) in which a project process holding a CUDA context has lock_ok = false"
      - "zero foreign compute processes (other than display/desktop clients and the idle CARLA-env client) during a gate or timed run"
      - "every run and attempt in the window has an infra block with journal_ok = true"
      - "every terminal registry row and attempt_end row in the window carries the infra fields"
pass: "all C1 tests pass AND C2 has zero violations"
fail_and_invalidation: >-
  A C1 failure -> fix and re-run C1 before any Phase II job. A C2 violation (i) invalidates every gate or timed run
  whose window contains it: that run's outputs are moved aside unread (or marked invalid if already read) and the
  run is repeated in full after the cause is removed; (ii) means R2(a)/(b) are not live: G-RV stays blocked until
  C2 is clean over a later window that contains at least one complete gate run after the fix. At most one such
  re-judgement: a violation in the re-judging window blocks G-RV until a PI decision row. Every violation and every
  invalidated run is listed in the ledger.
gpu_h: "C1 ~0.05; C2 uses windows that run anyway (plus any invalidated-run repeats)"
outputs: "experiments/repro/R2-LIVE/{c1_pytest.log, c2_compliance.json}"
