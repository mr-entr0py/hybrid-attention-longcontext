pass:   # copied from plan §2.5 (primary cell = 1024/256; 512/128 and overall secondary, descriptive)
  rule1_regime: "Zoology's mean on the primary cell must lie in [0.05, 0.95]. If it is above 0.95, the primary cell becomes the lowest-accuracy cell among the seven, labelled 'low power'. If it is below 0.05, it becomes 512/128. No new test configurations are added."
  rule2_phenomenon: "Zoology d64 mean < 0.925 (d128) < 0.957 (d256) on the primary cell. Zoology's d64 overall accuracy is reported next to the figure's ≈ 0.89 as context only."
  rule3_comparison: "Δ = mean_ours − mean_Zoology. FAIL iff |Δ| > max(0.03, 2.78·SE_W), SE_W = sqrt(s²_ours/3 + s²_Zoology/3), 2.78 = t0.975 at df≈4 (Welch). Otherwise PASS. The 90% CI of Δ is also reported."
  rule4_bimodality: "If either arm's three seeds span more than 0.2 on the primary cell, add 2 seeds per arm (pre-declared, 4 runs = O5). The comparison then becomes descriptive (INCONCLUSIVE), with no verdict on means."

readings:
  M1: "Metric = final_per_config_acc[cell] and final_overall_acc of each run JSON = the LAST validation record of the run (early-stopped, collapsed or 32-epoch), the same metric as R1/R4 G-RP. Not best-epoch."
  M2: "Per-arm mean = arithmetic mean over that arm's seeds; s² = sample variance with ddof = 1. All arithmetic on unrounded values."
  RG1: "Regime check uses the Zoology arm's 3-seed mean on 1024/256. 'In [0.05, 0.95]' is inclusive. If > 0.95: primary cell = the cell (of the seven test configs) with the lowest Zoology 3-seed mean (ties -> the longer config), labelled 'low power'. If < 0.05: primary = 512/128 (no further check). The primary cell is fixed by this rule before rules 2-4 are evaluated, and is the same cell for both arms."
  PH1: "Rule 2 compares the Zoology d64 3-seed mean on the primary cell with R1's Zoology values on THAT cell at d128 and d256 (table 'references'; for 1024/256 these are 0.92501171875 and 0.95655859375; the plan's 0.925/0.957 are their roundings). Strict inequalities. d128 < d256 holds by construction of the R1 numbers and is restated, not re-tested. Phenomenon PASS iff mean_Z(d64) < ref_d128 < ref_d256."
  CMP1: "Rule 3 uses the fixed constant 2.78 as frozen (not a recomputed Welch df). |Δ| exactly equal to the threshold is PASS (FAIL requires '>')."
  CMP2: "90% CI of Δ (descriptive): Δ ± t0.95(df_WS)·SE_W with the Welch–Satterthwaite df (df = 4 if both variances are 0); the df=4 interval (t0.95 = 2.132) is also printed."
  CMP3: "MDD (descriptive, reported once SDs are measured): 2.78·SE_W (the detectable |Δ| at the frozen t, 50% power) and (2.776+0.941)·SE_W (80% power, df 4). Per-arm seed SD of overall accuracy is reported next to G-RP(b)'s ±0.03 (plan §4.1 'R5 PASS' consequence)."
  BM1: "Rule 4: an arm's 'span' = max − min of its seeds' primary-cell values; bimodality fires iff span > 0.2 (strict) for either arm, evaluated on the 3 initial seeds after the primary cell is fixed. If it fires, O5 adds seeds (126,126) and (127,127) to BOTH arms (the next Zoology seeds; the plan does not name them), and R5 = INCONCLUSIVE. Under bimodality, rules 2 and 3 are both reported descriptively over 5 seeds per arm ('no verdict on means' covers rule 2 too, because rule 2 is also a statement about a mean)."
  V1: "Overall R5 verdict: INCONCLUSIVE if rule 4 fires. Otherwise PASS iff rule 2 PASS and rule 3 PASS; FAIL if rule 3 fails (the plan's 'FAIL iff'), and also FAIL (labelled 'phenomenon not replicated') if rule 2 fails while rule 3 passes — the summary-table criterion of plan §0 lists both conditions, so the conservative reading is taken. Sub-verdicts are always reported separately so the gate reader can see which part failed."
  V2: "BLOCKED if a run cannot complete within 6 attempts (per-epoch resume) or the queue is stopped by an infra event and not relaunched; no imputation."
  C1: "Collapse-abort exactly as R4 reading C1 (0-based epochs; abort after the 3rd consecutive epoch with index >= 3 and valid acc < 0.05). A collapsed run's final record (< 0.05) is its result and enters the means. Divergence is data, not an infra failure."
  P1: "bf16 arm = autocast scoped to the mixer (as R4 reading R4b-2): q/k/v/a/b projections, short convs, the fla chunk kernel inputs, o_norm and o_proj run under autocast; its output is promoted to fp32 before Zoology's fp32 residual; master weights and the rest of Zoology's model fp32. Evidence recorded per run: dtypes of q/g/beta at the first call into the GDN chunk kernel for BOTH arms (counter wrappers, no numerical effect)."
  I1: "Infrastructure as R4 I1/I2: each attempt holds scripts/repro/gpu_lock.py with --wait-exclusive <= 10 min (then lock only, recorded); concurrent project processes and kernel Xid/watchdog/OOM lines in the window are recorded; a run with an infra event in its window is repeated in full (gate run, §2.0); retries resume from the last per-epoch checkpoint, <= 6 attempts. Memory fraction 0.44."
  I2: "No run is repeated after its verdict has been read. No tuning: if R5 fails, the failure tree of plan §2.5 is reported as the next step, not executed in this item without a new instruction."

failure_tree: "plan §2.5: FAIL while R3a passes -> (1) rerun ours with Zoology-style casts (3 seeds); if the gap closes, bf16 projections change GDN capacity = property of 'GDN-A as built' (caveat on FEAS-2 / k=0). (2) gap persists -> compare init statistics (A_log, dt_bias, conv) and optimiser groups. (3) unexplained -> FEAS blocked, PI decides."
gpu_h_plan: "1.3-1.7 (6 runs x 13-17 min); O5 adds 0.9-1.1"
