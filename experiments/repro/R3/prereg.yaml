#   SHA-256 6bc14af62d7ac5151b5906e7596fbc6b3d0e261f114f65286292a958e8adcebc = DEV-01 row) and
#   reports/reproduction/protocol_amendment.md §17.4 (SHA-256 bf19a536…e338e6).
