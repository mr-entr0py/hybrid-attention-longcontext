    - "DEVIATION: runtime.activation_checkpointing=true on the trainer side and model.set_activation_checkpointing(True) on the reference side. Reason: VT-23 attempts 1-4 never reached a comparison; attempts 1-3 OOMed (physical contention + fragmentation), and attempt 4 (expandable_segments) hit the 0.44 cap with 6.58 GiB allocated at a 256 MiB request, so the pre-registered fp32 2x4K configuration does not fit the mandated 0.44 memory cap. Per-block non-reentrant recompute in deterministic fp32 replays the same kernels and does not change what the test targets (loss assembly, WD groups, schedule, clipping, accumulation). Criteria unchanged."
