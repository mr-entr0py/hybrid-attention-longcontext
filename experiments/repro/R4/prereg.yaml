pass:
  G-RP_b: "ours within +-0.03 of Zoology on overall accuracy at matched d_model and LR, reported per cell with its MDD, only after R3a passed."
  R4b: "mean of the in-distribution cells (64/4, 64/8, 64/16, 128/32, 256/64) >= 0.95 in both precisions; 512/128 and 1024/256 descriptive (beyond the 256-token training length with RoPE)."
  config_A: "descriptive only"

readings:
  G1: "Metric = final_overall_acc of each run JSON (= last validation record = wandb summary; identical to the G-RP(a) metric of R1). Zoology's value = the R1 run JSON at the same d_model and LR (table above)."
  G2: "A cell passes iff |ours - zoology| <= 0.03 (inclusive), computed on the unrounded values. G-RP(b) PASS iff all 4 cells pass; FAIL if any cell fails. The comparison is two-sided (ours higher by > 0.03 would also fail; impossible here since refs >= 0.989)."
  G3: "'matched LR' = the LR of the frozen run list (Zoology's best LR per width from s1a_results.json, as produced by part_b_runs(best_lr_from_s1a())). No other LR is run."
  G4: "Per-cell report: per-test-config accuracies of ours and Zoology and their differences, plus the MDD statement. Per-config differences are descriptive, not criteria."
  G5: "A cell whose run cannot complete in the allowed attempts (6, per-epoch resume) is BLOCKED; G-RP(b) is then not evaluable (reported, not imputed)."
  C1: "Collapse-abort (plan §2.0): epochs are Zoology's 0-based epoch_idx. 'after epoch 2' = epochs with index >= 3. Abort at the end of the first epoch e such that epochs e-2, e-1, e all have index >= 3 and overall valid accuracy < 0.05 (so the earliest abort is after epoch 5). The run JSON then has collapsed=true and its final record (< 0.05) is its result. This only changes compute."
  R4b-1: "Production F_g = build_mixer('A', cfg, n_heads=2, head_dim=64) with the protocol §3.3 defaults: qk_norm=True (per-head RMSNorm, gains init 1), rope=True, rope_theta=cfg.rope_theta=5e5, out_gate=True (headwise sigmoid gate g_proj). Inside Zoology's LanguageModel, Zoology's _init_weights applies as for every part-(b) mixer (all nn.Linear incl. g_proj ~ N(0, 0.02)); the o_proj is aliased as out_proj exactly as in OurFgZoology so that the ONLY differences from our_fg-d128-lr1.0e-03 are QK-norm, RoPE, the gate and head_dim (64 = d/2, unchanged at d=128). Positions are 0..T-1 per row (dense batch, no cu_seqlens)."
  R4b-2: "bf16 arm: the mixer's forward (projections, QK-norm, RoPE, attention, gate, o_proj) runs under torch.autocast('cuda', dtype=torch.bfloat16); its output is cast back to fp32 before Zoology's fp32 residual add (in production training the bf16 o_proj output is promoted to fp32 by the same residual add). The rest of Zoology's model (embeddings, BaseConv FFT conv, norms, LM head, CE) stays fp32 as in every other harness run; master weights fp32. Reason for scoping autocast to the mixer: the plan states the purpose (exercise varlen_attn/FA2 at training precision); Zoology's BaseConv FFT path is not a component under test. Evidence that varlen_attn is actually called is recorded in the run JSON (call counter)."
  R4b-3: "In-distribution mean = unweighted mean of the five per-config accuracies of the final validation record. Both precisions must reach >= 0.95."
  I1: "Infrastructure: every run is wrapped by scripts/repro/infra_events.py run (takes scripts/repro/gpu_lock.py; tries --wait-exclusive for <= 10 min, then proceeds with the lock only, since the orchestrator declared concurrent S0 GPU use). Concurrent project processes seen in the window are recorded (compute_apps_seen). A run whose window contains an infra event (Xid / RC watchdog / OOM) is repeated in full (gate run, §2.0) and both are reported."
  I2: "Retry: infra failure -> resume from last per-epoch checkpoint, <= 6 attempts. No run is repeated after its verdict has been read. No seed replicates (plan rule 7: no variance at ceiling)."
  outcomes: "PASS / FAIL per the criteria; BLOCKED if a run cannot complete; no INCONCLUSIVE condition is pre-declared for R4."

failure_tree: "plan §2.4: G-RP(b) fails while R3a passes -> init (out_proj alias, fla inits), Zoology optimiser groups, fp32 vs bf16 casts, missing attention dropout; swap one at a time. R4b fails -> RoPE, QK-norm temperature at small d, gate init; read attention max-logit and entropy statistics (recorded post-training on one test batch in every F_g run). Do not change F_g."
