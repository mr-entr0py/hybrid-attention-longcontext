# Experiment ledger: one entry per experiment, in the order the experiments were run.
#
# This is the human-facing ledger. Training runs are queued separately, in registry.jsonl
# (run queue, append-only).
#
# scripts/build_index.py validates this file and regenerates:
#   experiments/INDEX.md
#   the experiments table between the BEGIN/END markers in README.md
#
# Status vocabulary:
#   reproduced                    published result reproduced within the pre-registered criterion
#   partially-reproduced          some pre-registered criteria met, others not
#   not-passed-as-registered      ran; a frozen criterion was missed (diagnosis in the write-up)
#   measured                      measurement, not a reproduction (no pass/fail target)
#   verified                      infrastructure verification against fixed thresholds
#   planned                       pre-registered, not yet run
#
# commit: the first commit of this repository that contains the experiment's results. Code state
# at run time (including any uncommitted files) is recorded in each run's provenance block.

