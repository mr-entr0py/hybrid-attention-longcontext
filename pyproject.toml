[project]
name = "hybridlc"
version = "0.1.0"
description = "How much full attention does long context need? Controlled hybrid-attention ratio study in small LMs"
requires-python = ">=3.12"
dependencies = [
  "torch==2.11.0",
  "triton==3.6.0",
  "flash-linear-attention==0.6.0",
  "transformers==5.22.2",
  "tokenizers==0.23.3",
  "numpy==2.5.4",
  "einops",
  "pyyaml",
  "pyarrow",
  "huggingface-hub",
  "scipy",
  "matplotlib",
  "pandas",
  "wonderwords",
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA", "slow: > 1 min"]
