# Stage B at L_ext = 16K (FEAS fallback, protocol §13.3): 8 x 16K per step (same 131,072 tokens/step,
# so the step counts of stage_B.yaml are unchanged). DERIVED: the 60/40 mix needs a window that is a
# multiple of 8 sequences/step; 40 sequences (5 steps) with 24 PG19 keeps the exact 60% share.
inherits: stage_B.yaml
data:
  seq_len: 16384
  micro_batch: 1
  accum: 8
  mix: {pg19_per_window: 24, window_sequences: 40}
