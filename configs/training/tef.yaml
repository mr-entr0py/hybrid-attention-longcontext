# Task-exposure fine-tune, protocol §7.3: from the end of Stage B (LR 0) with AdamW moments carried,
# 50-step linear re-warm 0 -> 3e-4, then constant 3e-4. 65,536 tokens/step = 1 x 32K x 2 accumulation
# with checkpointing. Loss weights (D014 1/2-1/2) come from TEFStream's loss_weights.
inherits: base.yaml
stage: TEF
schedule:
  kind: warmup_constant
  warmup_steps: 50
  peak_lr: 3.0e-4             # fixed by the protocol (not eta*)
  steps: 1000
data:
  stream: tef
  stage: TEF
  seq_len: 32768
  micro_batch: 1
  accum: 2
  # TEFStream defaults = protocol (90/10 synthetic/replay, 1/2-1/2 loss). answer_norm: the D014 means
  # are taken over the 1,000-step block ("block", [IMPL] pending PI confirmation; equal answer-loss
  # weight per length bucket) or per optimiser step ("step", the literal reading; 32K bucket ~0.30 of
  # the answer weight). Verification round 3, TEF-STEP-NORMALISED-ANSWER-WEIGHT-LENGTH-SKEW.
  kwargs: {answer_norm: block}
runtime:
  activation_checkpointing: true
validation:
  every: 250
checkpoint:
  milestone_steps: [250, 500, 1000, 2000, 4000]
